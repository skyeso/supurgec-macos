name: Build & Release macOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Süpürgeç.app & Release Archives
        run: |
          chmod +x build.sh package_release.sh
          ./build.sh
          ./package_release.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Supurgec-macOS
          path: |
            build/*.dmg
            build/*.zip

      - name: Check Existing Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets | length' 2>/dev/null | grep -q '^[2-9]'; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_release.outputs.has_assets != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.zip
          generate_release_notes: true

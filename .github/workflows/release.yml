name: Build & Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Süpürgeç.app & Release Archives
        run: |
          chmod +x build.sh package_release.sh
          ./build.sh
          ./package_release.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Supurgec-macOS
          path: |
            build/*.dmg
            build/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.zip
          generate_release_notes: true
